<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microservice E-Commerce</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">CloudShop</div>
    <nav>
      <button class="nav-btn" onclick="showSection('feed')">Catalog</button>
      <button class="nav-btn" onclick="showSection('cart')">Cart <span id="cart-count">0</span></button>
      <button class="nav-btn auth-btn" id="auth-tab-btn" onclick="showSection('auth')">Login</button>
    </nav>
  </header>

  <main class="main-content">
    <!-- Auth View -->
    <section id="auth-section" class="view-section active">
      <div class="card auth-card">
        <h2 id="auth-title">Account Login</h2>
        <input type="email" id="email" placeholder="Email Address" required>
        <input type="password" id="password" placeholder="Password" required>
        <button class="btn btn-primary" onclick="handleAuth('login')">Login</button>
        <button class="btn btn-secondary" onclick="handleAuth('register')">Register New Account</button>
        <p id="auth-msg"></p>
      </div>
    </section>

    <!-- Product Feed View -->
    <section id="feed-section" class="view-section">
      <h2>Products Catalog</h2>
      <div id="product-grid" class="grid"></div>
    </section>

    <!-- Cart View -->
    <section id="cart-section" class="view-section">
      <h2>Your Shopping Cart</h2>
      <div id="cart-items" class="cart-container"></div>
      <div class="cart-summary">
        <h3>Total: $<span id="cart-total">0.00</span></h3>
        <button class="btn btn-success" onclick="checkout()">Checkout</button>
      </div>
    </section>
  </main>

  <script src="../js/app.js"></script>
</body>
</html>
